name : Deploy node.js backend to AWS EC2

on:
  push:
    branches:
      - main
jobs:
  deploy:

    runs-on: ubuntu-latest

    steps: 

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploye via SSH
      uses: appleboy/ssh-action@v1.0.3

      with:
        host: ${{secrets.SSH_HOST}}
        username: root
        key: ${{secrets.SSH_KEY}}
        script: | 
          cd JobHunt/server
          git fetch origin
          git reset --hard origin/main
          pm2 reload app